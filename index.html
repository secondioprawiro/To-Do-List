<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Daftar Tugasku</h1>
        </header>

        <section class="form-container">
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="Apa tugas barumu?" required>
                <button id="btn-tambah" type="submit">Tambah</button>
            </form>
        </section>

        <section class="list-container">
            <ul id="todo-list">
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
    </body>
</html>
